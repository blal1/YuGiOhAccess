# Checks that the bundled WindBot still compiles.
#
# This replaces the release pipeline inherited from the upstream WindBot
# repository, which had stopped working on every count: it ran on the retired
# windows-2019 image, used actions/checkout@v1 and the archived
# actions/create-release, built an Android library through Embeddinator that
# this project does not use, and deployed to a DEPLOY_REPO secret a fork does
# not have. It failed on every push.
#
# What this fork needs from CI here is narrower and actually useful: the bot is
# built by scripts/build_windbot.py and loaded in-process through pythonnet, so
# the thing worth catching is WindBot no longer compiling. The old pipeline is
# in the history if the upstream artifacts are ever wanted again.

name: Build WindBot

on:
  push:
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.sln"
      - "scripts/build_windbot.py"
      - ".github/workflows/windbot.yml"
  pull_request:
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.sln"
      - "scripts/build_windbot.py"
      - ".github/workflows/windbot.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The same project and output directory scripts/build_windbot.py uses,
      # so a green run here means that script will work too.
      - name: Build WindBot.Desktop
        run: dotnet build WindBot.Desktop.csproj --configuration Release

      - name: Check the assembly was produced
        shell: bash
        run: |
          set -e
          dll=$(find . -name "WindBot.Desktop.dll" -path "*Release*" | head -1)
          if [ -z "$dll" ]; then
            echo "WindBot.Desktop.dll was not built" >&2
            exit 1
          fi
          echo "Built $dll"

      - name: Upload the assembly
        uses: actions/upload-artifact@v4
        with:
          name: WindBot.Desktop
          path: "**/Release/**/WindBot.Desktop.dll"
          if-no-files-found: error
          retention-days: 7
